name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  force-click-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 포스터치 동작 검증
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined,address -Imodules/azoteq/include tests/force_click_test.c -o /tmp/force-click-test
          /tmp/force-click-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined,address -Imodules/azoteq/include tests/mouse_queue_test.c -o /tmp/mouse-queue-test
          /tmp/mouse-queue-test
          python3 tests/trace_parser_test.py
  build:
    needs: force-click-tests
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
    with:
      archive_name: firmware-v14
