name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  force-click-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 포스터치 동작 검증
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined,address tests/force_click_test.c -o /tmp/force-click-test
          /tmp/force-click-test
  build:
    needs: force-click-tests
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
